[project]
name = "voiceour-screen-kyutai-env"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "moshi==0.2.12",
  "torch==2.9.1",
  "torchaudio==2.9.1",
  "numpy<2.3",
  "sentencepiece==0.2.2",
  "sphn>=0.2.0,<0.3.0",
  "soundfile",
  "librosa",
  "huggingface_hub[hf_xet]<1.0.0",
]
[tool.uv]
package = false
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
