[project]
name = "voiceour-polish-train-env"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "torch==2.11.0",
  "transformers",
  "peft",
  "accelerate",
  "datasets",
  "safetensors",
  "numpy",
  "huggingface_hub[hf_xet]",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
