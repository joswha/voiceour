[package]
name = "tdt-tail"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Benchmark-only Rust TDT decode tail (prediction LSTM + joint + greedy TDT) for bet B1, with an ablation ladder of arms and a C11 control."
build = "build.rs"

[lib]
name = "tdt_tail"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "tail-bench"
path = "src/bin/tail-bench.rs"

[dependencies]
parakeet-model = { path = "../parakeet-model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
# The C ABI catches panics and reports them through `err`; that needs unwinding.
panic = "unwind"
debug = "line-tables-only"

# Own workspace: bench crates never join a parent workspace.
[workspace]
