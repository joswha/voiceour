[project]
name = "voiceour-asr"
version = "0.1.0"
description = "Voiceour local ASR sidecar"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "parakeet-mlx==0.5.2",
    "huggingface_hub",
    "pydantic>=2",
    # Vendored ARK-ASR runtime (backends/ark_mlx): audio loading, tokenizer and
    # feature extractor, checkpoint reader. Ranges follow the upstream ark-asr-mlx
    # pyproject the vendored copy was tested against; transformers 5 is a breaking
    # major that copy has never seen.
    "librosa>=0.11,<0.12",
    "transformers>=4.57,<5",
    "safetensors>=0.5,<1",
]

[tool.uv]
constraint-dependencies = [
    "numba>=0.61",  # Python 3.12+ compatibility floor for parakeet-mlx/librosa.
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
# The vendored ARK runtime is a verbatim upstream copy (see its NOTICE); linting it
# would invite fixes that silently fork it.
extend-exclude = ["src/voiceour_asr/backends/ark_mlx"]

[tool.ruff.lint]
# Pyflakes, pycodestyle, isort, bugbear, comprehensions, pyupgrade. Deliberately
# narrow: a linter that fires on correct code trains everyone to ignore it.
select = ["F", "E", "W", "I", "B", "C4", "UP"]
