name: Real ASR

# The only job that touches the real models. It downloads both pinned artifacts —
# Granite's 0.51 GB default and Parakeet's 1.26 GB Balanced conversion — and decodes
# real audio, so it runs weekly rather than per push, and it is not a required gate:
# a Hugging Face outage must not block a merge.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  real-asr:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Assert the macOS 27 toolchain
        run: |
          set -euo pipefail
          sw_vers -productVersion | grep -E '^27\.'
          xcodebuild -version | grep -E '^Xcode 27'
          [ "$(xcrun --show-sdk-version | cut -d. -f1)" = "27" ]
          swift --version 2>&1 | grep -E 'Swift version 6\.4'
          [ "$(uname -m)" = "arm64" ]

      # Each key carries the artifact's file name as well as its revision: the Parakeet
      # revision publishes several conversions of one checkpoint, so the revision alone
      # does not identify the bytes. Parakeet's entry caches its default variant, which
      # is what the build under test downloads when nothing sets VOICEOUR_MODEL_VARIANT.
      - name: Cache the pinned Granite artifact
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Voiceour/granite-speech-5.0-470m-turboctc-q8_0
          key: granite-gguf-62f64d9d5ad35989b06caf199cafe7155944a22b-granite-speech-5.0-470m-turboctc-multilingual-Q8_0.gguf

      - name: Cache the pinned Parakeet artifact
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Voiceour/parakeet-tdt-0.6b-v3-ggml
          key: parakeet-gguf-35156454d1a39de06863303dd209fd2bed6ee079-ggml-parakeet-tdt-0.6b-v3-f16.bin

      - name: Build
        run: swift build

      # `fixtures/audio/` is generated, not committed: `say` + `afconvert` build
      # it from text, so the repository carries no recording of anyone's voice.
      - name: Generate the spoken fixture
        run: make fixture

      # The commands that prove a machine can go from no model to a real local
      # transcript: Granite, the default, then Parakeet. If the hosted runner has no
      # Metal device, ggml falls back to BLAS/CPU and these still pass, slower.
      - name: Prove the default Granite model
        run: .build/debug/voiceour-asr --prove fixtures/audio/hello_16k_mono.wav

      - name: Prove the Parakeet model
        run: VOICEOUR_ASR_BACKEND=parakeet .build/debug/voiceour-asr --prove fixtures/audio/hello_16k_mono.wav

      - name: Integration tests against the real models
        run: |
          VOICEOUR_GRANITE_INTEGRATION=1 VOICEOUR_PARAKEET_INTEGRATION=1 swift test -Xswiftc -DUI_HARNESS \
            --filter "SidecarProcessTests|parakeetSessionPersistsEndToEndTelemetry|GraniteSidecarBackendTests"
