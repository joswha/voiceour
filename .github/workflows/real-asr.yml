name: Real ASR

# The only job that touches the real model. It downloads the pinned 0.51 GB Granite
# artifact and decodes real audio, so it runs weekly rather than per push, and it is not
# a required gate: a Hugging Face outage must not block a merge.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  real-asr:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Assert the macOS 27 toolchain
        run: |
          set -euo pipefail
          sw_vers -productVersion | grep -E '^27\.'
          xcodebuild -version | grep -E '^Xcode 27'
          [ "$(xcrun --show-sdk-version | cut -d. -f1)" = "27" ]
          swift --version 2>&1 | grep -E 'Swift version 6\.4'
          [ "$(uname -m)" = "arm64" ]

      # The key carries the artifact's file name as well as its revision, so a re-pin of
      # either one misses the cache instead of restoring stale bytes.
      - name: Cache the pinned Granite artifact
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Voiceour/granite-speech-5.0-470m-turboctc-q8_0
          key: granite-gguf-bd7db273aa69a26fc81e370c84597fa738fe2ad0-granite-speech-5.0-470m-turboctc-Q8_0.gguf

      - name: Build
        run: swift build

      # `fixtures/audio/` is generated, not committed: `say` + `afconvert` build
      # it from text, so the repository carries no recording of anyone's voice.
      - name: Generate the spoken fixture
        run: make fixture

      # The command that proves a machine can go from no model to a real local
      # transcript. If the hosted runner has no Metal device, ggml falls back to
      # BLAS/CPU and this still passes, slower.
      - name: Prove the Granite model
        run: .build/debug/voiceour-asr --prove fixtures/audio/hello_16k_mono.wav

      - name: Integration tests against the real model
        run: |
          VOICEOUR_GRANITE_INTEGRATION=1 swift test -Xswiftc -DUI_HARNESS \
            --filter "SidecarProcessTests|graniteSessionPersistsEndToEndTelemetry|GraniteSidecarBackendTests"
