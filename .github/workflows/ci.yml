name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A force-push supersedes its own in-flight run. Pushes to main are not
# cancelled: main's history is what the badge reports.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # macos-26, not macos-15: the console's glass ground subclasses
  # `NSGlassEffectView` and three surfaces call SwiftUI `.glassEffect`, both
  # macOS 26 APIs behind `if #available(macOS 26, *)`. Availability gates the
  # runtime call, not the compile, so the runner has to carry the macOS 26 SDK
  # even though the deployment target stays macOS 14.
  ci:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # `bench/` is the only Python left in this repository, and it never ships.
      - name: Install uv and cache Python dependencies
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: |
            bench/pyproject.toml
            bench/uv.lock

      - name: Build
        run: make build

      # Enabled only after the repo-wide formatting commit landed green, so this
      # gate has never had to tolerate a pre-existing violation.
      - name: Swift format check
        run: make format-check

      - name: Docs consistency
        run: make check-docs

      - name: Python lint
        run: make lint-python

      # -DUI_HARNESS: the offscreen harness and its test suites are compiled
      # out of a plain build, which is what keeps them out of the shipping binary.
      - name: Swift tests
        run: make test

      # Flow journals and named expectations are host-independent semantic contracts,
      # so they are required. Scene accessibility dumps, PNG digests, and their lint
      # findings remain advisory on hosted runners below.
      - name: Semantic UI flows
        run: make ui-flow

      - name: Benchmark tests
        run: cd bench && uv --no-config run pytest

      - name: Fake app self-test
        run: scripts/run_dev.sh --self-test

      - name: Offline benchmark smoke
        run: make bench-smoke

      # Voiceour deliberately exposes no local IPC surface. A socket that
      # brokers this app's microphone and Accessibility grants to any same-uid
      # process would launder a per-code-identity TCC decision, so there is no
      # control plane and no terminal client, and this step keeps it that way.
      - name: Assert no local control plane
        run: |
          set -euo pipefail
          if [ -e tui ]; then echo "a terminal control client has appeared at tui/"; exit 1; fi
          if [ -e fixtures/control ]; then echo "control-protocol fixtures have appeared"; exit 1; fi
          if grep -rnE 'ControlService|ControlSocketServer|ControlProtocol|ControlTranscription|ControlServerDefaults|fileTranscriptionInFlight' Sources Tests; then
            echo "control-plane symbols have appeared"; exit 1
          fi

  release:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build release configuration
        run: swift build -c release

      - name: Bundle release app
        run: scripts/bundle.sh

      - name: Verify release bundle
        run: scripts/verify_bundle.sh

  # Not a required gate yet. The scene PNG digests and accessibility dumps were
  # generated on the maintainer's Apple Silicon Mac, and an offscreen AppKit render
  # on a hosted runner may still differ in display scale, font rasterisation, or AX
  # geometry even now that the OS matches. The semantic flow-journal gate is required
  # above; promote the scene snapshots and their lint findings only after two
  # consecutive green runs on main.
  ui-snapshots:
    runs-on: macos-26
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Portable UI snapshots
        run: make ui-snap
